spring.application.name=customer-service
server.port=8081

spring.datasource.url=${CUSTOMER_DB_URL:jdbc:mysql://localhost:3306/customerdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${CUSTOMER_DB_USERNAME:root}
spring.datasource.password=${CUSTOMER_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8080}
jwt.secret=${JWT_SECRET:my-super-secret-jwt-key-that-is-long-enough-123456}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}