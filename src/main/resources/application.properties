spring.application.name=customer-service
server.port=8081

spring.datasource.url=${CUSTOMER_DB_URL:jdbc:mysql://localhost:3306/customerdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${CUSTOMER_DB_USERNAME:root}
spring.datasource.password=${CUSTOMER_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false